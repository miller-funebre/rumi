:root{ --pizarra:#253439; --gris:#7b898a; --taupe:#b29e85; --hueso:#f5f4f0; --linea:#3c4d52; --alerta:#d98878;
       --d:'PoppinsR',system-ui,-apple-system,sans-serif; --s:'LoraR',Georgia,serif; color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pizarra);color:var(--hueso);font-family:var(--d);font-weight:500;font-size:16px;line-height:1.5;
     padding:28px max(16px,env(safe-area-inset-left,0)) 40px max(16px,env(safe-area-inset-right,0))}
.wrap{max-width:460px;margin:0 auto}

.marca{display:flex;justify-content:center;margin-bottom:26px}
.marca svg{width:120px;height:auto;display:block}

.tarjeta{border:1px solid var(--linea);border-radius:14px;padding:26px 22px 24px;text-align:center}
.t-nom{font-size:22px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;text-wrap:balance;margin-bottom:3px}
.t-sub{font-family:var(--s);font-style:italic;font-size:14px;color:var(--taupe);margin-bottom:22px}
.sellos{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:20px}
.sello{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--linea);display:flex;align-items:center;justify-content:center;
       font-size:13px;font-weight:700;color:var(--gris)}
.sello.lleno{border-color:var(--taupe);background:var(--taupe);color:var(--pizarra)}
.sello.lleno svg{width:46%;height:46%}
.sello.premio{border-color:var(--taupe);border-style:dashed;color:var(--taupe);font-size:9px;letter-spacing:.6px}
.sello.premio.listo{background:var(--taupe);border-style:solid;color:var(--pizarra)}
.estado{font-family:var(--s);font-size:15px;color:var(--gris)}
.estado b{color:var(--hueso);font-family:var(--d);font-weight:700}
.estado.gano{color:var(--taupe)}

.pie-mark{display:flex;justify-content:center;margin-top:24px;opacity:.8}
.pie-mark svg{width:46px;height:46px}

h1.titulo{font-size:14px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--taupe);margin-bottom:14px}
.alta{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;min-width:0;background:transparent;border:1px solid var(--linea);border-radius:9px;color:var(--hueso);
      font-family:var(--d);font-size:16px;padding:11px 13px}
input::placeholder{color:var(--gris)}
input:focus-visible,button:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
button{font-family:var(--d);font-weight:700;font-size:15px;border-radius:9px;border:1px solid var(--linea);
       background:transparent;color:var(--hueso);padding:11px 15px;cursor:pointer}
button:hover{border-color:var(--taupe)}
button.oro{background:var(--taupe);border-color:var(--taupe);color:var(--pizarra)}

.lista{display:flex;flex-direction:column;gap:10px}
.fila{border:1px solid var(--linea);border-radius:12px;padding:14px 15px}
.fila.full{border-color:var(--taupe)}
.f-top{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.f-nom{flex:1;min-width:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.f-cnt{font-size:15px;font-weight:700;color:var(--taupe);font-variant-numeric:tabular-nums}
.barra{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:12px}
.pt{height:5px;border-radius:3px;background:var(--linea)}
.pt.on{background:var(--taupe)}
.f-btns{display:flex;flex-wrap:wrap;gap:7px}
.f-btns button{font-size:14px;padding:8px 12px}
.f-btns .crece{flex:1 1 auto}
.f-btns .del{color:var(--alerta);border-color:transparent;padding:8px 10px}
.conf{margin-top:11px;padding-top:11px;border-top:1px solid var(--linea);font-size:14px;color:var(--gris)}
.conf-b{display:flex;gap:7px;margin-top:9px}

.vacio{border:1px dashed var(--linea);border-radius:12px;padding:22px 18px;text-align:center;color:var(--gris);
       font-family:var(--s);font-size:15px;line-height:1.5}
.aviso{margin-top:22px;padding-top:16px;border-top:1px solid var(--linea);font-family:var(--s);font-size:13.5px;
       line-height:1.6;color:var(--gris)}
.aviso code{font-family:var(--d);font-size:12.5px;color:var(--taupe)}
.resp{display:flex;gap:7px;margin-top:14px}
.resp button{flex:1;font-size:13px;padding:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0));
       background:var(--taupe);color:var(--pizarra);font-size:14px;font-weight:700;padding:10px 18px;border-radius:22px;z-index:20}
.volver{margin-top:20px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gris);
        background:none;border:none;padding:6px 0;cursor:pointer}
canvas{display:none}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="lienzo" width="1080" height="1080"></canvas>
<script>
(function(){
"use strict";
var META = 9;
var LETRAS = [{"tx": 0.0, "ty": 120.0, "sx": 0.1, "sy": -0.1, "d": "M408 564V383H361Q297 383 265.0 355.5Q233 328 233 259V0H62V558H233V465Q263 511 308.0 537.5Q353 564 408 564Z"}, {"tx": 42.8, "ty": 120.0, "sx": 0.1, "sy": -0.1, "d": "M613 558V0H442V76Q416 39 371.5 16.5Q327 -6 273 -6Q209 -6 160.0 22.5Q111 51 84.0 105.0Q57 159 57 232V558H227V255Q227 199 256.0 168.0Q285 137 334 137Q384 137 413.0 168.0Q442 199 442 255V558Z"}, {"tx": 110.2, "ty": 120.0, "sx": 0.1, "sy": -0.1, "d": "M1001 326V0H831V303Q831 357 802.5 386.5Q774 416 724 416Q674 416 645.5 386.5Q617 357 617 303V0H447V303Q447 357 418.5 386.5Q390 416 340 416Q290 416 261.5 386.5Q233 357 233 303V0H62V558H233V488Q259 523 301.0 543.5Q343 564 396 564Q459 564 508.5 537.0Q558 510 586 460Q615 506 665.0 535.0Q715 564 774 564Q878 564 939.5 501.0Q1001 438 1001 326Z"}, {"tx": 216.1, "ty": 120.0, "sx": 0.1, "sy": -0.1, "d": "M46 708Q46 748 74.5 774.5Q103 801 148 801Q192 801 220.5 774.5Q249 748 249 708Q249 669 220.5 642.5Q192 616 148 616Q103 616 74.5 642.5Q46 669 46 708ZM233 558V0H62V558Z"}];
var CORAZON = "M 76.3,60 C 68,52 58,45 58,37.5 C 58,30.5 65,27 70.2,30.2 C 73,31.9 75.2,34.4 76.3,36.2 C 77.4,34.4 79.6,31.9 82.4,30.2 C 87.6,27 94.6,30.5 94.6,37.5 C 94.6,45 84.6,52 76.3,60 Z";
var BOWL = "M 4,12 L 20,12 A 8,8 0 0 1 4,12 Z";
var HEART_S = "M 9,8 C 9,6 11,5.4 12,6.8 C 13,5.4 15,6 15,8 C 15,9.8 12,12 12,12 C 12,12 9,9.8 9,8 Z";

var COL = { pizarra:"#253439", gris:"#7b898a", taupe:"#b29e85", hueso:"#f5f4f0", linea:"#3c4d52" };

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- logotipo como SVG ---------- */
function logoSVG(w){
  var g = LETRAS.map(function(l){
    return '<g transform="translate('+l.tx+' '+l.ty+') scale('+l.sx+' '+l.sy+')"><path d="'+l.d+'"/></g>';
  }).join("");
  return '<svg viewBox="-2 22 250 104" xmlns="http://www.w3.org/2000/svg" style="width:'+w+'">'
    + '<g fill="'+COL.hueso+'">'+g+'</g>'
    + '<path d="'+CORAZON+'" fill="'+COL.taupe+'"/></svg>';
}
function bowlSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="'+BOWL+'" fill="none" stroke="'+COL.hueso+'" stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="'+HEART_S+'" fill="'+COL.taupe+'"/></svg>';
}
var GOTA = '<svg viewBox="0 0 24 24"><path d="'+BOWL+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
  + '<path d="'+HEART_S+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';

/* ---------- almacenamiento ---------- */
var CLAVE = "rumi.clientes.v1";
function cargar(){ try{ var r=localStorage.getItem(CLAVE); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function salvar(l){ try{ localStorage.setItem(CLAVE, JSON.stringify(l)); }catch(e){} }
var lista = cargar(), confirmando = null;

function toast(t){ var v=document.querySelector(".toast"); if(v)v.remove();
  var d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d);
  setTimeout(function(){d.remove();},2200); }

/* ---------- ligas ---------- */
function ligaDe(c){
  return location.origin + location.pathname + "#" + c.sellos + "/" + encodeURIComponent(c.nombre);
}
function leerHash(){
  var h = decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(!h) return null;
  if(h === "mostrador") return {mostrador:true};
  var i = h.indexOf("/");
  if(i < 0) return null;
  var n = parseInt(h.slice(0,i),10);
  var nom = h.slice(i+1).trim();
  if(isNaN(n) || !nom) return null;
  return { nombre:nom, sellos:Math.max(0,Math.min(META,n)) };
}

/* ---------- tarjeta ---------- */
function tarjetaHTML(c){
  var s="";
  for(var i=1;i<=META;i++) s += '<div class="sello'+(i<=c.sellos?" lleno":"")+'">'+(i<=c.sellos?GOTA:i)+'</div>';
  var listo = c.sellos>=META;
  s += '<div class="sello premio'+(listo?" listo":"")+'">GRATIS</div>';
  var faltan = META - c.sellos;
  var est = listo
    ? '<p class="estado gano"><b>Tu próxima avena va gratis.</b><br>Nomás dila al pedir.</p>'
    : '<p class="estado">Llevas <b>'+c.sellos+' de '+META+'</b>.'
      + (faltan===1 ? ' Una más y la siguiente va gratis.' : ' Faltan <b>'+faltan+'</b> para la gratis.')+'</p>';
  return '<div class="tarjeta"><div class="t-nom">'+esc(c.nombre)+'</div>'
    + '<div class="t-sub">tarjeta de fidelidad</div>'
    + '<div class="sellos">'+s+'</div>'+est+'</div>';
}

function vistaCliente(c){
  return '<div class="wrap"><div class="marca">'+logoSVG("120px")+'</div>'
    + tarjetaHTML(c)
    + '<div class="pie-mark">'+bowlSVG()+'</div></div>';
}
function vistaLanding(){
  return '<div class="wrap"><div class="marca">'+logoSVG("120px")+'</div>'
    + '<div class="vacio">Abre la liga que te mandó Rumi para ver tu tarjeta.</div></div>';
}

/* ---------- mostrador ---------- */
function filaHTML(c,i){
  var p=""; for(var k=1;k<=META;k++) p+='<div class="pt'+(k<=c.sellos?" on":"")+'"></div>';
  var listo=c.sellos>=META;
  var princ = listo
    ? '<button class="oro crece" data-canje="'+i+'">Entregar la gratis</button>'
    : '<button class="oro crece" data-mas="'+i+'">+ Sello</button>';
  var conf = (confirmando===i)
    ? '<div class="conf">¿Eliminar a '+esc(c.nombre)+'?<div class="conf-b">'
      + '<button data-del="'+i+'">Sí, eliminar</button><button data-nodel="1">Cancelar</button></div></div>' : "";
  return '<div class="fila'+(listo?" full":"")+'">'
    + '<div class="f-top"><span class="f-nom">'+esc(c.nombre)+'</span><span class="f-cnt">'+c.sellos+'/'+META+'</span></div>'
    + '<div class="barra">'+p+'</div><div class="f-btns">'+princ
    + '<button data-menos="'+i+'">−</button>'
    + '<button data-liga="'+i+'">Liga</button>'
    + '<button data-png="'+i+'">Imagen</button>'
    + '<button class="del" data-pide="'+i+'">Borrar</button></div>'+conf+'</div>';
}
function vistaMostrador(){
  var cuerpo = lista.length
    ? '<div class="lista">'+lista.map(filaHTML).join("")+'</div>'
    : '<div class="vacio">Agrega tu primer cliente arriba.<br>Te damos su liga y su imagen.</div>';
  return '<div class="wrap"><div class="marca">'+logoSVG("110px")+'</div>'
    + '<h1 class="titulo">Mostrador</h1>'
    + '<div class="alta"><input type="text" id="nuevo" placeholder="Nombre del cliente" autocomplete="off">'
    + '<button class="oro" data-add="1">Agregar</button></div>'
    + cuerpo
    + '<div class="resp"><button data-bak="1">Descargar respaldo</button><button data-res="1">Cargar respaldo</button></div>'
    + '<p class="aviso">La lista se guarda solo en este navegador. Baja el respaldo de vez en cuando.<br><br>'
    + 'Guarda esta página en tu pantalla de inicio con <code>#mostrador</code> al final.</p></div>';
}

/* ---------- imagen ---------- */
function dibujar(c){
  var cv=document.getElementById("lienzo"), x=cv.getContext("2d"), W=1080, H=1080;
  x.fillStyle=COL.pizarra; x.fillRect(0,0,W,H);

  // logotipo
  x.save();
  var lw=430, k=lw/250, lx=(W-lw)/2, ly=150;
  x.translate(lx - (-2)*k, ly - 22*k); x.scale(k,k);
  x.fillStyle=COL.hueso;
  LETRAS.forEach(function(l){
    x.save(); x.translate(l.tx,l.ty); x.scale(l.sx,l.sy);
    x.fill(new Path2D(l.d)); x.restore();
  });
  x.fillStyle=COL.taupe; x.fill(new Path2D(CORAZON));
  x.restore();

  // nombre
  x.textAlign="center"; x.fillStyle=COL.hueso;
  x.font='700 54px PoppinsR, sans-serif';
  x.fillText(c.nombre.toUpperCase(), W/2, 400);
  x.fillStyle=COL.taupe; x.font='italic 34px LoraR, serif';
  x.fillText("tarjeta de fidelidad", W/2, 452);

  // sellos
  var r=56, gap=36, cols=5, tot=cols*2*r+(cols-1)*gap, x0=(W-tot)/2+r, y0=580, fila=2*r+gap;
  for(var i=0;i<10;i++){
    var cx=x0+(i%cols)*(2*r+gap), cy=y0+Math.floor(i/cols)*fila, n=i+1;
    x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2);
    if(n<=c.sellos){ x.fillStyle=COL.taupe; x.fill(); dibujarBowl(x,cx,cy,r,COL.pizarra); }
    else if(n===10){
      x.setLineDash([9,8]); x.strokeStyle=COL.taupe; x.lineWidth=3.5; x.stroke(); x.setLineDash([]);
      x.fillStyle=COL.taupe; x.font='700 22px PoppinsR, sans-serif'; x.fillText("GRATIS",cx,cy+8);
    } else {
      x.strokeStyle=COL.linea; x.lineWidth=3.5; x.stroke();
      x.fillStyle=COL.gris; x.font='700 32px PoppinsR, sans-serif'; x.fillText(String(n),cx,cy+11);
    }
  }
  // premio ganado
  if(c.sellos>=META){
    var cxp=x0+4*(2*r+gap), cyp=y0+fila;
    x.beginPath(); x.arc(cxp,cyp,r,0,Math.PI*2); x.fillStyle=COL.taupe; x.fill();
    x.fillStyle=COL.pizarra; x.font='700 22px PoppinsR, sans-serif'; x.fillText("GRATIS",cxp,cyp+8);
  }

  // estado
  var faltan=META-c.sellos;
  x.font='italic 36px LoraR, serif';
  if(c.sellos>=META){ x.fillStyle=COL.taupe; x.fillText("Tu próxima avena va gratis.", W/2, 900); }
  else { x.fillStyle=COL.gris; x.fillText("Llevas "+c.sellos+" de "+META+". Faltan "+faltan+".", W/2, 900); }

  // marca al pie
  dibujarBowl(x, W/2, 985, 34, COL.hueso, COL.taupe);
  return cv;
}
function dibujarBowl(x,cx,cy,r,tinta,acento){
  var k=r/16;
  x.save(); x.translate(cx-12*k, cy-12*k); x.scale(k,k);
  x.strokeStyle=tinta; x.lineWidth=2; x.lineJoin="round";
  x.stroke(new Path2D(BOWL));
  if(acento){ x.fillStyle=acento; x.fill(new Path2D(HEART_S)); }
  else { x.strokeStyle=tinta; x.lineWidth=1.7; x.stroke(new Path2D(HEART_S)); }
  x.restore();
}
function bajarPNG(c){
  var cv=dibujar(c);
  cv.toBlob(function(b){
    var u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download="rumi-"+c.nombre.replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase()+".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},1000);
    toast("Imagen descargada");
  },"image/png");
}

/* ---------- acciones ---------- */
function pintar(){
  var h=leerHash();
  if(h && h.mostrador) document.getElementById("root").innerHTML=vistaMostrador();
  else if(h) document.getElementById("root").innerHTML=vistaCliente(h);
  else document.getElementById("root").innerHTML=vistaLanding();
}
function copiar(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(msg);}).catch(function(){prompt("Copia la liga:",txt);});
  } else prompt("Copia la liga:",txt);
}

document.getElementById("root").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return; var d=b.dataset;
  if(d.add){ var i=document.getElementById("nuevo"); var n=(i.value||"").trim();
    if(n){ lista.push({nombre:n,sellos:0}); lista.sort(function(a,z){return a.nombre.localeCompare(z.nombre,"es");});
           salvar(lista); i.value=""; pintar(); toast(n+" agregado"); } }
  else if(d.mas!==undefined){ var c=lista[d.mas]; c.sellos=Math.min(META,c.sellos+1); salvar(lista); pintar(); }
  else if(d.menos!==undefined){ var c2=lista[d.menos]; c2.sellos=Math.max(0,c2.sellos-1); salvar(lista); pintar(); }
  else if(d.canje!==undefined){ var c3=lista[d.canje]; c3.sellos=0; salvar(lista); pintar(); toast("Gratis entregada a "+c3.nombre); }
  else if(d.liga!==undefined){ copiar(ligaDe(lista[d.liga]),"Liga copiada"); }
  else if(d.png!==undefined){ bajarPNG(lista[d.png]); }
  else if(d.pide!==undefined){ confirmando=+d.pide; pintar(); }
  else if(d.del!==undefined){ lista.splice(d.del,1); confirmando=null; salvar(lista); pintar(); }
  else if(d.nodel){ confirmando=null; pintar(); }
  else if(d.bak){ var blob=new Blob([JSON.stringify(lista,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download="rumi-clientes.json"; document.body.appendChild(a); a.click(); a.remove(); toast("Respaldo descargado"); }
  else if(d.res){ var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var fr=new FileReader();
      fr.onload=function(){ try{ var j=JSON.parse(fr.result); if(Array.isArray(j)){ lista=j; salvar(lista); pintar(); toast("Respaldo cargado"); } }
        catch(err){ toast("Archivo no válido"); } }; fr.readAsText(f); };
    inp.click(); }
});
document.getElementById("root").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="nuevo"){ e.target.nextElementSibling.click(); }
});
window.addEventListener("hashchange",function(){confirmando=null;pintar();});
pintar();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){});
})();
</script>
</body>
</html>
